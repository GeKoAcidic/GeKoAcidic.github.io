<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Instore - Day 3</title>
    <link href="css/store.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            let eventNo = -1;
            let progressable = true;


            let eventText = [
                "Hmm, it seems I need to stock up on ingredients.",
                "Good morning, herbalist! I’m Riven Swiftarrow, an adventurer in need of your help.",
                "Good morning, Riven. What can I do for you?",
                "I've just returned from a quest, and I'm exhausted and wounded.",
                "I need potions to heal my wounds and restore my energy for the next adventure.",
                "Let me see... A <b>Potion of Health</b> should help you recover quickly.",
                "Thank you, Cecil! This will help me get back on my feet. Here’s " + getGold(600)+" gold for your help.",
                "You're welcome, Riven. Take care and good luck on your next quest.",
                "Thanks! I’ll be sure to return if I need more supplies.",
                "That’s a shame. I was really counting on your help.",
                "I’m very sorry, Riven.",
                "Guess I'll have to find another way. Farewell.",
                "Good day, herbalist. I'm Thistle Meadowcroft.",
                "Good day, Thistle. How can I assist you?",
                "I'm looking for healing herbs to treat my family's ailments and soothe our tired bodies after working in the fields.",
                "A <b>Potion of Rejuvenation</b> should help with that.",
                "Thank you, Cecil. This will mean a lot to my family. Here’s " + getGold(300)+" gold for your help.",
                "You're welcome, Thistle. I hope it brings relief to your family.",
                "It surely will. Thank you again. Farewell.",
                "Oh, that’s unfortunate. My family could really use the help.",
                "I’m very sorry, Thistle.",
                "I understand. Goodbye.",
                "Greetings, herbalist. I am King Thorian Ironheart.",
                "Your Majesty, welcome to my humble shop. How may I serve you?",
                "I seek a rare elixir to fortify my strength and sharpen my mind. I have a royal decree requesting your finest concoctions.",
                "Of course, Your Majesty. I should have a <b>Potion of Wealth</b> that should meet your needs.",
                "Excellent. Your skills are commendable, herbalist. Here’s " + getGold(3000)+" gold as a token of my gratitude.",
                "Thank you, Your Majesty. It is an honor to serve you.",
                "Continue your good work, Cecil. Farewell.",
                "This is disappointing. I expected better service.",
                "My deepest apologies, Your Majesty.",
                "Very well. I shall take my leave.",
                "Another eventful day. Each customer brings new challenges and opportunities."
            ]
            let speaker = [
                "Cecil",
                "Riven",
                "Cecil",
                "Riven",
                "Riven",
                "Cecil",
                "Riven",
                "Cecil",
                "Riven",
                "Riven",
                "Cecil",
                "Riven",
                "Thistle",
                "Cecil",
                "Thistle",
                "Cecil",
                "Thistle",
                "Cecil",
                "Thistle",
                "Thistle",
                "Cecil",
                "Thistle",
                "King Ironheart",
                "Cecil",
                "King Ironheart",
                "Cecil",
                "King Ironheart",
                "Cecil",
                "King Ironheart",
                "King Ironheart",
                "Cecil",
                "King Ironheart",
                "Cecil"
            ]

            let currCustomer = 0;
            let stage = localStorage.getItem('stage');

            $('#content').html(eventText[eventNo]);

            $('#bookHolder').hide();
            $('.customer').hide();
            $('#acceptQuest').hide();

            if (stage != 0) {
                $('#introSplash').hide();
            }

            $('#introSplash').click(function () {
                $('#introSplash').fadeOut();
            })

            $('#cecil').click(events);
            $('#output').click(events);
            $('.customer').click(events);

            eventNo = stage - 1;

            events();

            function events() {
                if (progressable) {
                    eventNo++
                }
                localStorage.setItem('stage', eventNo);

                if (eventNo < eventText.length) {
                    $('#content').html(eventText[eventNo]);
                } else {
                    localStorage.setItem('day', "day4")
                    localStorage.setItem("stage", 0);
                    window.location = 'day4.html'
                }

                changeSpeaker(speaker[eventNo]);


                if (eventNo == 0) {
                    if (progressable) {
                        progressable = false;
                    } else if (!progressable) {
                        localStorage.setItem("stage", 1);
                        window.location = 'plantStore.html';
                    }
                }

                //events for Riven
                if (eventNo == 1) {
                    $('#riven').fadeIn(1000);
                }
                if (eventNo > 1 && eventNo < 12) {
                    $('#riven').show();
                }
                if (eventNo == 5) {
                    progressable = false;
                    $('#acceptQuest').show();
                    currCustomer = 1;
                }

                if(eventNo == 6){
                    $('#content').html("Thank you, Cecil! This will help me get back on my feet. Here’s " + getGold(600)+" gold for your help.");
                }

                if (eventNo == 8) {
                    eventNo = 11;
                }

                //end of riven, start of thistle
                if (eventNo == 12) {
                    $('#riven').fadeOut();
                    $('#thistle').fadeIn(1000);
                }

                if (eventNo > 12 && eventNo < 22) {
                    $('#thistle').show();
                }
                if (eventNo == 15) {
                    progressable = false;
                    $('#acceptQuest').show();
                    currCustomer = 2;
                }

                if(eventNo == 16){
                    $('#content').html("Thank you, Cecil. This will mean a lot to my family. Here’s " + getGold(300)+" gold for your help.");
                }

                if (eventNo == 18) {
                    eventNo = 21;
                }

                //end of thistle, start of thorian
                if (eventNo == 22) {
                    $('#thistle').fadeOut();
                    $('#thorian').fadeIn(1000);
                }

                if (eventNo > 22 && eventNo < 32) {
                    $('#thorian').show();
                }
                if (eventNo == 25) {
                    progressable = false;
                    $('#acceptQuest').show();
                    currCustomer = 3;
                }

                if(eventNo == 26){
                    $('#content').html("Excellent. Your skills are commendable, herbalist. Here’s " + getGold(3000)+" gold as a token of my gratitude.");
                }

                if (eventNo == 28) {
                    eventNo = 31;
                }
                if (eventNo == 32) {
                    $('#thorian').fadeOut();
                }

            }

            $(document).on('click', '#yes', function () {
                if (currCustomer == 1) {
                    questAccepted("Potion of Health", 600)
                }
                if (currCustomer == 2) {
                    questAccepted("Potion of Rejuvenation", 300)
                }
                if (currCustomer == 3) {
                    questAccepted("Potion of Wealth", 3000)
                }
            })

            $(document).on('click', '#no', function () {
                let rep = Number(localStorage.getItem("Reputation"));
                rep -= 0.1;
                if (rep < 0.2) {
                    rep = 0.2;
                }
                rep = rep.toFixed(1);
                localStorage.setItem("Reputation", rep);

                $('#acceptQuest').hide();

                if (currCustomer == 1) {
                    eventNo = 9;
                }
                if (currCustomer == 2) {
                    eventNo = 19;
                }
                if (currCustomer == 3) {
                    eventNo = 29;
                }
                events();
                progressable = true;
            })

            $(document).on('click', '#book', function () {
                $('#bookHolder').show();
                $('#leftArrow').hide();
                $('.bookPage').hide();
                $('#page1').show();
                pageNum = 1;
            })
            $(document).on('click', '#closeBook', function () {
                $('#bookHolder').hide();
                $('.bookPage').hide();
                pageNum = 1;
            })
            $(document).on('click', '#rightArrow', function () {
                pageNum++;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if (pageNum === 2) {
                    $('#leftArrow').show();
                }
                if (pageNum === 6) {
                    $('#rightArrow').hide();
                }
            })
            $(document).on('click', '#leftArrow', function () {
                pageNum--;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if (pageNum === 5) {
                    $('#rightArrow').show();
                }
                if (pageNum === 1) {
                    $('#leftArrow').hide();
                }
            })
            $(document).on('click', '.tool', function () {
                let pageName = $(this).data('pagename');
                localStorage.setItem("stage", eventNo);
                window.location = pageName;
            })

            function changeSpeaker(name) {
                $('#speaker').html(name + ":");
                $("#speaker").css('font-size', '30px')
                if (name === "Tutorial") {
                    $('#speaker').css('color', '#f0f0f0')
                }
                if (name === "Cecil") {
                    $('#speaker').css('color', '#4287f5')
                }
                if (name === "Poetica") {
                    $('#speaker').css('color', '#fa41a4')
                }
                if (name === "Sir Froststeel") {
                    $('#speaker').css({
                        'color': '#bfbfbf',
                        'font-size': '22px',
                    })
                }
                if (name === "Thorn") {
                    $('#speaker').css('color', '#fa3e2d')
                }
                if (name === "King Ironheart") {
                    $('#speaker').css({
                        'color': '#ffdb0f',
                        'font-size': '20px',
                    })
                }
                if (name === "Merlin") {
                    $('#speaker').css('color', '#bf0fff')
                }
                if (name === "Riven") {
                    $('#speaker').css('color', '#54ff68')
                }
                if (name === "Thistle") {
                    $('#speaker').css('color', '#8a4000')
                }
            }

            function questAccepted(item, reward) {
                let have = localStorage.getItem(item);
                if (have > 0) {
                    have--
                    localStorage.setItem(item, have)
                    let gold = Number(localStorage.getItem("Gold"));
                    let rep = Number(localStorage.getItem("Reputation"));
                    reward *= rep;
                    gold += reward
                    rep += 0.1;
                    gold = Math.round(gold);
                    rep = rep.toFixed(1);
                    localStorage.setItem("Gold", gold);
                    localStorage.setItem("Reputation", rep);
                    progressable = true;
                    events();
                    $('#acceptQuest').hide();
                } else {
                    changeSpeaker("Cecil")
                    $('#content').html("<b><i>I don't have that item</i></b>");
                }
            }

            function getGold(amount) {
                let rep = Number(localStorage.getItem("Reputation"));
                rep -= 0.1;
                rep=rep.toFixed(1)
                console.log(rep);
                amount *= rep;
                amount = Math.round(amount)
                return amount;
            }


        })
    </script>
</head>

<body>
    <div id="stage">
        <img src="Images/Sprites/People/Cecil.png" id="cecil" alt="A picture of Cecil">
        <img src="Images/Sprites/People/Riven.png" id="riven" class="customer" alt="A picture of Riven">
        <img src="Images/Sprites/People/Thistle.png" id="thistle" class="customer" alt="A picture of Thistle">
        <img src="Images/Sprites/People/Thorian.png" id="thorian" class="customer" alt="A picture of Thorian">


        <img src="Images/Sprites/Items/mortar.png" id="mortar" class="tool" data-pagename="mortar.html"
            alt="a picture of a mortar and pestle">
        <img src="Images/Sprites/Items/dryingRack.png" id="rack" class="tool" data-pagename="rack.html"
            alt="a picture of a drying rack">
        <img src="Images/Sprites/Items/choppingBoard.png" id="board" class="tool" data-pagename="board.html"
            alt="a picture of a chopping board">
        <img src="Images/Sprites/Items/mixingBowl.png" id="bowl" class="tool" data-pagename="bowl.html"
            alt="a picture of a mixingBowl">

        <div id="output">
            <p id="speaker">Cecil:</p>
            <p id="content">Test</p>
        </div>
        <div id="acceptQuest">
            <button id="yes" class="questBtn">ACCEPT</button>
            <button id="no" class="questBtn">DENY</button>
        </div>

        <img src="Images/Sprites/Book/Book.png" id="book">

        <div id="bookHolder">
            <img src="Images/Sprites/Book/page1.png" id="page1" class="bookPage" alt="Recipe book page 1">
            <img src="Images/Sprites/Book/page2.png" id="page2" class="bookPage" alt="Recipe book page 2">
            <img src="Images/Sprites/Book/page3.png" id="page3" class="bookPage" alt="Recipe book page 3">
            <img src="Images/Sprites/Book/page4.png" id="page4" class="bookPage" alt="Recipe book page 4">
            <img src="Images/Sprites/Book/page5.png" id="page5" class="bookPage" alt="Recipe book page 5">
            <img src="Images/Sprites/Book/page6.png" id="page6" class="bookPage" alt="Recipe book page 6">

            <img src="Images/Sprites/Icons/X.png" id="closeBook" class="bookIcon">
            <img src="Images/Sprites/Icons/arrow.png" id="leftArrow" class="bookIcon">
            <img src="Images/Sprites/Icons/arrow.png" id="rightArrow" class="bookIcon">
        </div>

        <div id="introSplash">
            <h1 id="introSplashTxt">DAY 3</h1>
        </div>
    </div>
</body>

</html>
