<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mixing Bowl</title>
    <link href="css/mixingBowl.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            var inventory = Object.entries(localStorage);
            var gold = localStorage.getItem("Gold");
            var numSelected = 0;

            var selectedItems = [null, null, null];


            reloadTables();

            function reloadTables() {
                let counter = 0;
                numSelected = 0;
                selectedItems = [null, null, null];


                $('.icon').hide();
                $('.potionReward').hide();
                $('#rewardGivenOuter').hide();
                $('#bookHolder').hide();

                $('#fresh').empty();
                $('#processed').empty();
                $('#potions').empty();
                inventory = Object.entries(localStorage);
                localStorage.clear();
                inventory.sort();
                for (i = 0; i < inventory.length; i++) {
                    if (inventory[i][1] != 0) {
                        if (inventory[i][0] !== "debug" && inventory[i][0] !== "Gold" && inventory[i][0] !== "day" && inventory[i][0] !== "stage" && inventory[i][0] !== "Reputation") {

                            counter++;

                            let firstWord = inventory[i][0];
                            firstWord = firstWord.replace(/ .*/, '');
                            if (firstWord === "Dried" || firstWord === "Chopped" || firstWord === "Crushed") {
                                $('#processed').append(
                                    '<li id="' + inventory[i][0] + '" class="ingredient" data-invindexid="' + i + '"><b>' + inventory[i][0] + ':</b> ' + inventory[i][1] + '</li>'
                                );
                            } else if (firstWord === "Potion") {
                                $('#potions').append(
                                    '<li id="' + inventory[i][0] + '" class="potion" data-invindexid="' + i + '"><b>' + inventory[i][0] + ':</b> ' + inventory[i][1] + '</li>'
                                );
                            } else {
                                $('#fresh').append(
                                    '<li id="' + inventory[i][0] + '" class="ingredient" data-invindexid="' + i + '"><b>' + inventory[i][0] + ':</b> ' + inventory[i][1] + '</li>'
                                );
                            }

                        }
                        localStorage.setItem(inventory[i][0], inventory[i][1]);
                    }
                }

                //size adjustment to keep the inventory list from overflowing
                if (counter > 22) {
                    let sizeAdjustment = counter - 22;
                    sizeAdjustment /= 11;
                    sizeAdjustment *= 10;
                    sizeAdjustment = 20 - sizeAdjustment;

                    //little catch case, because these numbers still overflow (rounding error I believe)
                    if (counter >= 27 && counter <= 29) {
                        sizeAdjustment -= 1;
                    }
                    $('#items').css("font-size", sizeAdjustment.toString() + "px");
                }
            };


            $(document).on('click', '.ingredient', function () {
                //remove item
                if ($(this).css('border-color') == 'rgb(255, 0, 0)') {
                    $(this).css({
                        'border-color': 'gold',
                        'color': 'gold'
                    });
                    numSelected--;
                    let relevantIcon = inventory[$(this).data("invindexid")][0]
                    relevantIcon = "#" + relevantIcon.replace(/\s+/g, '');
                    $(relevantIcon).hide();

                    for (i = 0; i < selectedItems.length; i++) {
                        if (selectedItems[i] != null) {
                            if (selectedItems[i][2] == $(this).data("invindexid")) {
                                selectedItems[i] = null;
                                i = selectedItems.length;
                            }
                        }
                    }
                }
                //add item
                else if (numSelected < 3 && $(this).css('border-color') == 'rgb(255, 215, 0)') {
                    $(this).css({
                        'border-color': 'red',
                        'color': 'red'
                    });
                    numSelected++
                    let relevantIcon = inventory[$(this).data("invindexid")][0]
                    relevantIcon = "#" + relevantIcon.replace(/\s+/g, '');
                    $(relevantIcon).show();

                    for (i = 0; i < selectedItems.length; i++) {
                        if (selectedItems[i] == null) {
                            let currInvItem = inventory[$(this).data("invindexid")]
                            selectedItems[i] = [currInvItem[0], currInvItem[1], $(this).data("invindexid")]
                            i = selectedItems.length;
                        }
                    }
                }
            })

            //when hovering over a list item it glows gold to indicate interactability
            $(document).on('mouseenter', '.ingredient', function () {
                if ($(this).css('border-color') == 'rgb(255, 255, 255)') {

                    $(this).css({
                        'border-color': 'gold',
                        'color': 'gold'
                    });
                    let relevantIcon = inventory[$(this).data("invindexid")][0]
                    relevantIcon = "#" + relevantIcon.replace(/\s+/g, '');
                    $(relevantIcon).show();

                } else if ($(this).css('border-color') == 'rgb(0, 255, 0)') {
                    $(this).css({
                        'border-color': 'red',
                        'color': 'red'
                    });
                }
            });
            $(document).on('mouseleave', '.ingredient', function () {
                if ($(this).css('border-color') == 'rgb(255, 0, 0)') {
                    $(this).css({
                        'border-color': 'lime',
                        'color': 'lime'
                    });
                } else if ($(this).css('border-color') == 'rgb(255, 215, 0)') {
                    $(this).css({
                        'border-color': 'white',
                        'color': 'white'
                    });
                    let relevantIcon = inventory[$(this).data("invindexid")][0]
                    relevantIcon = "#" + relevantIcon.replace(/\s+/g, '');
                    $(relevantIcon).hide();
                }
            });

            //when mouse enters tool icon it scales slightly
            $(document).on('mouseenter', '#bowl', function () {
                $(this).css('scale', '1.1 1.1');
            });

            $(document).on('mouseleave', '#bowl', function () {
                $(this).css('scale', '1 1');
            });

            $(document).on('click', '#bowl', function () {
                selectedItems.sort();
                checkRecipie(["Chopped Essence", "Crushed Whisperleaf", "Dried Lotus"], "Potion of Health");
                checkRecipie(["Crushed Nightshade", "Dried Orchid", "Runeleaf Elixirfern"], "Potion of Stealth");
                checkRecipie(["Chopped Whisperleaf", "Dried Essence", "Phoenix Emberthorn"], "Potion of Knowledge");
                checkRecipie(["Chopped Elixirfern", "Chopped Lotus", "Dried Orchid"], "Potion of Rejuvenation");
                checkRecipie(["Crushed Lotus", "Faerie Mist Orchid", "Shadowfire Nightshade"], "Potion of Strength");
                checkRecipie(["Chopped Emberthorn", "Crushed Emberthorn", "Dried Emberthorn"], "Potion of Wealth");

            });

            function checkRecipie(ingredient, reward) {
                for (let i = 0; i < selectedItems.length; i++) {
                    if (selectedItems[i] === null) {
                        console.log("null")
                        return;
                    } else if (selectedItems[i][0] !== ingredient[i]) {
                        return;
                    }
                }

                for (let i = 0; i < selectedItems.length; i++) {
                    invSubtractItem(selectedItems[i][0]);
                }

                invAddItem(reward);

                $('#itemMade').html(reward);
                $('#rewardGivenOuter').show();
                let relevantIcon = reward;
                relevantIcon = "#" + relevantIcon.replace(/\s+/g, '');
                $(relevantIcon).show();
            };

            $(document).on('click', '#acceptReward', function () {
                reloadTables();
            });

            function invAddItem(name) {
                let temp = Number(localStorage.getItem(name));
                temp += 1;
                localStorage.setItem(name, temp);
            }

            function invSubtractItem(name) {
                let temp = Number(localStorage.getItem(name));
                temp -= 1;
                localStorage.setItem(name, temp);
            }

            $(document).on('click', '#book', function () {
                $('#bookHolder').show();
                $('#leftArrow').hide();
                $('.bookPage').hide();
                $('#page1').show();
                pageNum = 1;
            })

            $(document).on('click', '#closeBook', function () {
                $('#bookHolder').hide();
                $('.bookPage').hide();
                pageNum = 1;
            })

            $(document).on('click', '#rightArrow', function () {
                pageNum++;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if(pageNum === 2){
                    $('#leftArrow').show();
                }
                if(pageNum === 6){
                    $('#rightArrow').hide();
                }
            })

            $(document).on('click', '#leftArrow', function () {
                pageNum--;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if(pageNum === 5){
                    $('#rightArrow').show();
                }
                if(pageNum === 1){
                    $('#leftArrow').hide();
                }
            })

            $(document).on('click', '#returnToStore', function () {
                let page = localStorage.getItem('day');
                page = page +'.html';
                window.location = page;
            })

        })
    </script>
</head>
