<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Instore - Day 2</title>
    <link href="css/store.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            let eventNo = -1;
            let progressable = true;


            eventText = [
                "Hmm, it seems I need to stock up on ingredients.",
                "Good morning, herbalist. I am Sir Gawain Froststeel.",
                "Good morning, Sir Froststeel. How can I assist you today?",
                "I have an important battle approaching, and I need a potion to strengthen me for the fight. Do you have anything that could help?",
                "Let me see... Yes, I have a <b>Potion of Strength</b> that should be just what you need.",
                "Thank you, Cecil. This potion will be invaluable. Here's " + getGold(700)+" gold for your service.",
                "You're welcome. Good luck in your battle, Sir Froststeel.",
                "I shall return victorious. Farewell.",
                "That is unfortunate. I had hoped for your assistance.",
                "I’m very sorry, Sir Froststeel.",
                "Very well. Farewell.",
                "Well it’s getting late and it’s been a long day",
                "Time to close the sto-",
                "Evening, herbalist. Name's Thorn Quickblade.",
                "What brings you here at this hour, Thorn?",
                "I need a potion for... certain endeavors. Something to enhance my stealth. You understand, don't you?",
                "I see. A <b>Potion of Stealth</b> might be what you're looking for.",
                "Much appreciated, Cecil. Here's " + getGold(300)+" gold for your troubles.",
                "Take care, Thorn. And be careful out there.",
                "Oh, I always am. Farewell.",
                "That's disappointing, Cecil. I was really counting on your help.",
                "I’m very sorry, Thorn.",
                "Very well. But remember, I don't forget those who cross me.",
                "What a day... This is only the beginning."
            ]

            speaker = [
                "Cecil",
                "Sir Froststeel",
                "Cecil",
                "Sir Froststeel",
                "Cecil",
                "Sir Froststeel",
                "Cecil",
                "Sir Froststeel",
                "Sir Froststeel",
                "Cecil",
                "Sir Froststeel",
                "Cecil",
                "Cecil",
                "Thorn",
                "Cecil",
                "Thorn",
                "Cecil",
                "Thorn",
                "Cecil",
                "Thorn",
                "Thorn",
                "Cecil",
                "Thorn",
                "Cecil"
            ]

            let currCustomer = 0;
            let stage = localStorage.getItem('stage');

            $('#content').html(eventText[eventNo]);

            $('#bookHolder').hide();
            $('.customer').hide();
            $('#acceptQuest').hide();

            if (stage != 0) {
                $('#introSplash').hide();
            }

            $('#introSplash').click(function () {
                $('#introSplash').fadeOut();
            })

            $('#cecil').click(events);
            $('#output').click(events);
            $('.customer').click(events);

            eventNo = stage - 1;

            events();

            function events() {
                if (progressable) {
                    eventNo++
                    eventText = eventText;
                }
                localStorage.setItem('stage', eventNo);

                if (eventNo < eventText.length) {
                    $('#content').html(eventText[eventNo]);
                } else {
                    localStorage.setItem('day', "day3")
                    localStorage.setItem("stage", 0);
                    window.location = 'day3.html'
                }

                changeSpeaker(speaker[eventNo]);

                if (eventNo == 0) {
                    if (progressable) {
                        progressable = false;
                    } else if (!progressable) {
                        localStorage.setItem("stage", 1);
                        window.location = 'plantStore.html';
                    }
                }

                if (eventNo == 1) {
                    $('#Gawain').fadeIn(1000);
                }
                if (eventNo > 1 && eventNo < 11) {
                    $('#Gawain').show();
                }

                if (eventNo == 4) {
                    progressable = false;
                    $('#acceptQuest').show();
                    currCustomer = 1;
                }

                if(eventNo == 5){
                    $('#content').html("Thank you, Cecil. This potion will be invaluable. Here's " + getGold(700)+" gold for your service.");
                }

                if (eventNo == 7) {
                    eventNo = 10;
                }

                if (eventNo == 11) {
                    $('#Gawain').fadeOut();
                }

                if (eventNo == 12) {
                    $('#Thorn').fadeIn(1000);
                }
                if (eventNo > 12 && eventNo < 23) {
                    $('#Thorn').show();
                }

                if (eventNo == 16) {
                    progressable = false;
                    $('#acceptQuest').show();
                    currCustomer = 2;
                }
                if(eventNo == 17){
                    $('#content').html("Much appreciated, Cecil. Here's " + getGold(300)+" gold for your troubles.");
                }

                if (eventNo == 19) {
                    eventNo = 22;
                }

                if (eventNo == 23) {
                    $('#Thorn').fadeOut();
                }

            }

            $(document).on('click', '#yes', function () {
                if (currCustomer == 1) {
                    questAccepted("Potion of Strength", 700)
                }
                if (currCustomer == 2) {
                    questAccepted("Potion of Stealth", 300)
                    let rep = Number(localStorage.getItem("Reputation"));
                    rep -= 0.3;
                    if (rep < 0.2) {
                        rep = 0.2;
                    }
                    rep = rep.toFixed(1);
                    localStorage.setItem("Reputation", rep);
                }
            })

            $(document).on('click', '#no', function () {
                let rep = Number(localStorage.getItem("Reputation"));
                rep -= 0.1;
                rep = rep.toFixed(1);
                if (rep < 0.2) {
                    rep = 0.2;
                }
                localStorage.setItem("Reputation", rep);

                $('#acceptQuest').hide();

                if (currCustomer == 1) {
                    eventNo = 8;
                }
                if (currCustomer == 2) {
                    eventNo = 20;
                }
                events();
                progressable = true;
            })

            $(document).on('click', '#book', function () {
                $('#bookHolder').show();
                $('#leftArrow').hide();
                $('.bookPage').hide();
                $('#page1').show();
                pageNum = 1;
            })
            $(document).on('click', '#closeBook', function () {
                $('#bookHolder').hide();
                $('.bookPage').hide();
                pageNum = 1;
            })
            $(document).on('click', '#rightArrow', function () {
                pageNum++;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if (pageNum === 2) {
                    $('#leftArrow').show();
                }
                if (pageNum === 6) {
                    $('#rightArrow').hide();
                }
            })
            $(document).on('click', '#leftArrow', function () {
                pageNum--;
                $('.bookPage').hide();
                let page = "#page" + pageNum;
                $(page).show();
                if (pageNum === 5) {
                    $('#rightArrow').show();
                }
                if (pageNum === 1) {
                    $('#leftArrow').hide();
                }
            })
            $(document).on('click', '.tool', function () {
                let pageName = $(this).data('pagename');
                localStorage.setItem("stage", eventNo);
                window.location = pageName;
            })

            function changeSpeaker(name) {
                $('#speaker').html(name + ":");
                $("#speaker").css('font-size', '30px')
                if (name === "Tutorial") {
                    $('#speaker').css('color', '#f0f0f0')
                }
                if (name === "Cecil") {
                    $('#speaker').css('color', '#4287f5')
                }
                if (name === "Poetica") {
                    $('#speaker').css('color', '#fa41a4')
                }
                if (name === "Sir Froststeel") {
                    $('#speaker').css({
                        'color': '#bfbfbf',
                        'font-size': '22px',
                    })
                }
                if (name === "Thorn") {
                    $('#speaker').css('color', '#fa3e2d')
                }
                if (name === "King Ironheart") {
                    $('#speaker').css({
                        'color': '#ffdb0f',
                        'font-size': '22px',
                    })
                }
                if (name === "Merlin") {
                    $('#speaker').css('color', '#bf0fff')
                }
                if (name === "Riven") {
                    $('#speaker').css('color', '#54ff68')
                }
            }

            function questAccepted(item, reward) {
                let have = localStorage.getItem(item);
                if (have > 0) {
                    have--
                    localStorage.setItem(item, have)
                    let gold = Number(localStorage.getItem("Gold"));
                    let rep = Number(localStorage.getItem("Reputation"));
                    reward *= rep;
                    gold += reward
                    rep += 0.1;
                    gold = Math.round(gold);
                    rep = rep.toFixed(1);
                    localStorage.setItem("Gold", gold);
                    localStorage.setItem("Reputation", rep);
                    progressable = true;
                    events();
                    $('#acceptQuest').hide();
                } else {
                    changeSpeaker("Cecil")
                    $('#content').html("<b><i>I don't have that item</i></b>");
                }
            }

            function getGold(amount) {
                let rep = Number(localStorage.getItem("Reputation"));
                rep -= 0.1;
                rep=rep.toFixed(1)
                console.log(rep);
                amount *= rep;
                amount = Math.round(amount)
                return amount;
            }

        })
    </script>
</head>

<body>
    <div id="stage">
        <img src="Images/Sprites/People/Cecil.png" id="cecil" alt="A picture of Cecil">
        <img src="Images/Sprites/People/Gawain.png" id="Gawain" class="customer" alt="A picture of Gawain">
        <img src="Images/Sprites/People/Thorn.png" id="Thorn" class="customer" alt="A picture of Thorn">

        <img src="Images/Sprites/Items/mortar.png" id="mortar" class="tool" data-pagename="mortar.html"
            alt="a picture of a mortar and pestle">
        <img src="Images/Sprites/Items/dryingRack.png" id="rack" class="tool" data-pagename="rack.html"
            alt="a picture of a drying rack">
        <img src="Images/Sprites/Items/choppingBoard.png" id="board" class="tool" data-pagename="board.html"
            alt="a picture of a chopping board">
        <img src="Images/Sprites/Items/mixingBowl.png" id="bowl" class="tool" data-pagename="bowl.html"
            alt="a picture of a mixingBowl">

        <div id="output">
            <p id="speaker">Cecil:</p>
            <p id="content">Test</p>
        </div>
        <div id="acceptQuest">
            <button id="yes" class="questBtn">ACCEPT</button>
            <button id="no" class="questBtn">DENY</button>
        </div>

        <img src="Images/Sprites/Book/Book.png" id="book">

        <div id="bookHolder">
            <img src="Images/Sprites/Book/page1.png" id="page1" class="bookPage" alt="Recipe book page 1">
            <img src="Images/Sprites/Book/page2.png" id="page2" class="bookPage" alt="Recipe book page 2">
            <img src="Images/Sprites/Book/page3.png" id="page3" class="bookPage" alt="Recipe book page 3">
            <img src="Images/Sprites/Book/page4.png" id="page4" class="bookPage" alt="Recipe book page 4">
            <img src="Images/Sprites/Book/page5.png" id="page5" class="bookPage" alt="Recipe book page 5">
            <img src="Images/Sprites/Book/page6.png" id="page6" class="bookPage" alt="Recipe book page 6">

            <img src="Images/Sprites/Icons/X.png" id="closeBook" class="bookIcon">
            <img src="Images/Sprites/Icons/arrow.png" id="leftArrow" class="bookIcon">
            <img src="Images/Sprites/Icons/arrow.png" id="rightArrow" class="bookIcon">
        </div>

        <div id="introSplash">
            <h1 id="introSplashTxt">DAY 2</h1>
        </div>
    </div>
</body>

</html>
